# 独立可建：插件目录自带 workspace，不依赖任何上层 Cargo.toml。
[workspace]
members = ["."]
resolver = "2"

[package]
name = "tma-official-listenbrainz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tma-plugin-sdk = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
testkit = { path = "../../testkit" }
